name: CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-test-container:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore FiapCloudGames.API.sln -p:NuGetAudit=true -warnaserror:NU1901,NU1902,NU1903,NU1904

      - name: Build
        run: dotnet build FiapCloudGames.API.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test FiapCloudGames.API.sln --configuration Release --no-build --no-restore

      - name: Build container image
        run: docker build --tag fcg-catalog:${{ github.sha }} .

      - name: Diagnosticar Claims OIDC
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
      
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
      
            console.log('Issuer:', payload.iss);
            console.log('Audience:', payload.aud);
            console.log('Subject:', payload.sub);

      - name: Autenticar na AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::432342421632:role/GithubActionsOidcRole
          aws-region: us-east-1

      - name: Login no Amazon ECR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/fase-4-catalog-and')
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Publicar imagem no Amazon ECR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/fase-4-catalog-and')
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: fcg-final
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag "fcg-catalog:$IMAGE_TAG" "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
