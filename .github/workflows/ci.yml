name: CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-container:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore FiapCloudGames.API.sln -p:NuGetAudit=true -warnaserror:NU1901,NU1902,NU1903,NU1904

      - name: Build
        run: dotnet build FiapCloudGames.API.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test FiapCloudGames.API.sln --configuration Release --no-build --no-restore

      - name: Build container image
        run: docker build --tag fcg-catalog:${{ github.sha }} .

      # --- ETAPAS DE TESTE DO OIDC E ECR ---

      - name: Diagnosticar Claims OIDC
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
      
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
      
            console.log('Issuer:', payload.iss);
            console.log('Audience:', payload.aud);
            console.log('Subject:', payload.sub);

      - name: Autenticar na AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::432342421632:role/GithubActionsOidcRole
          aws-region: us-east-1

      - name: Testar Build da Imagem Docker (Sem Push)
        run: |
          echo "Build finalizado com sucesso! (Push desativado propositalmente)"
