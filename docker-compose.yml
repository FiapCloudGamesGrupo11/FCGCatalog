services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "${FCG_SQL_PASSWORD:?Defina FCG_SQL_PASSWORD no arquivo .env}"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$SA_PASSWORD -C -Q 'SELECT 1'"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: fcg-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${FCG_MONGO_USER:?Defina FCG_MONGO_USER no arquivo .env}"
      MONGO_INITDB_ROOT_PASSWORD: "${FCG_MONGO_PASSWORD:?Defina FCG_MONGO_PASSWORD no arquivo .env}"
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: "${FCG_RABBITMQ_USER:?Defina FCG_RABBITMQ_USER no arquivo .env}"
      RABBITMQ_DEFAULT_PASS: "${FCG_RABBITMQ_PASSWORD:?Defina FCG_RABBITMQ_PASSWORD no arquivo .env}"
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: fcg-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fiapcloudgames:latest
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      JwtSettings__SecretKey: "${FCG_JWT_SECRET:?Defina FCG_JWT_SECRET no arquivo .env}"
      ConnectionStrings__ConnectionString: "Server=db,1433;Initial Catalog=FiapCloudGames;User Id=sa;Password=${FCG_SQL_PASSWORD};TrustServerCertificate=True;"
      MongoSettings__ConnectionString: "mongodb://${FCG_MONGO_USER}:${FCG_MONGO_PASSWORD}@mongo:27017/FiapCloudGames?authSource=admin"
      MongoSettings__DatabaseName: "FiapCloudGames"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__User: "${FCG_RABBITMQ_USER}"
      RabbitMq__Password: "${FCG_RABBITMQ_PASSWORD}"
      RabbitMq__OrderQueueName: "order-placed"
      RabbitMq__PaymentProcessQueueName: "catalog-payment-processed"
      Redis__ConnectionString: "redis:6379"
      Redis__InstanceName: "FiapCloudGames:"
      OpenSearch__Endpoint: "http://opensearch:9200"
      OpenSearch__IndexName: "games-v1"
      OpenSearch__UseAwsSigV4: "false"

  userapi:
    build:
      context: .
      dockerfile: Dockerfile
    image: fcguserapi:latest
    container_name: fcg-userapi
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8070
      JwtSettings__SecretKey: "${FCG_JWT_SECRET}"
      ConnectionStrings__ConnectionString: "Server=db,1433;Initial Catalog=FiapCloudGames;User Id=sa;Password=${FCG_SQL_PASSWORD};TrustServerCertificate=True;"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__Username: "${FCG_RABBITMQ_USER}"
      RabbitMQ__Password: "${FCG_RABBITMQ_PASSWORD}"
      RabbitMQ__QueueName: user-created
      CatalogApi__BaseUrl: "http://api:80"
    ports:
      - "8070:8070"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  paymentsapi:
    image: fcgpaymentsapi:latest
    container_name: apipayments
    build:
      context: .
      dockerfile: PaymentsAPI/Dockerfile
    ports:
      - "8090:8090"
      - "8091:8091"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMQ__Url=rabbitmq
      - RabbitMQ__User=${FCG_RABBITMQ_USER}
      - RabbitMQ__Password=${FCG_RABBITMQ_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy

  notifications-api:
    build:
      context: .
      dockerfile: NotificationsAPI/Dockerfile
    image: fcgnotificationapi:latest
    container_name: notifications-api
    ports:
      - "5001:8080"
    depends_on:
      - rabbitmq

volumes:
  mongo-data:
